plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = providers.gradleProperty('mod_version').get()
group = 'io.github.flycats233.isometricprojection'
base { archivesName = 'IsometricProjection' }
repositories {
    maven {
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder' }
    }
}
dependencies {
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.81+mc1.21.1') { transitive = false }
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.265'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { isometricprojection { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { from('LICENSE') { into 'META-INF' } }
tasks.named('processResources') {
    inputs.property('mod_version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version) }
}

// ModDevGradle supplies Minecraft libraries to main; reuse them for headless math checks.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.register('verifyControls', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.flycats233.isometricprojection.ControlMathCheck'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('verifyControls') }
// Regression checks use a standalone main rather than a JUnit engine.
tasks.named('test') { failOnNoDiscoveredTests = false }
